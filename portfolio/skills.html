<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thirumalai Portfolio | Skills</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: linear-gradient(to right, #ece9e6, #ffffff);
      background-image: radial-gradient(circle at top left, rgba(255, 200, 200, 0.2), transparent),
                        radial-gradient(circle at bottom right, rgba(200, 200, 255, 0.2), transparent);
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #333;
      padding-top: 60px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    nav {
      position: fixed;
      top: 0; left: 0; width: 100%;
      background-color: #2c3e50;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    nav .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 25px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
      font-size: 16px;
    }
    nav ul li a:hover {
      color: #f39c12;
    }
    section {
      margin: 80px 20px 40px;
      max-width: 900px;
      width: 100%;
      text-align: center;
    }
    h2 {
      font-size: 36px;
      color: #34495e;
      margin-bottom: 40px;
      letter-spacing: 1.5px;
      position: relative;
      display: inline-block;
      padding-bottom: 8px;
    }
    h2::after {
      content: '';
      display: block;
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #f39c12, #e67e22);
      margin: 8px auto 0;
      border-radius: 2px;
    }

    .skills-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 30px;
      padding: 0 10px;
    }

    .skill-item {
      background: linear-gradient(145deg, #ffffff, #d0e8ff);
      border-radius: 20px;
      box-shadow:
        6px 6px 15px #a3c2ff,
        -6px -6px 15px #ffffff;
      padding: 30px 0;
      font-size: 22px;
      font-weight: 600;
      color: #1a237e;
      cursor: default;
      user-select: none;
      transition: transform 0.4s cubic-bezier(.03,.98,.52,.99),
                  box-shadow 0.4s cubic-bezier(.03,.98,.52,.99);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 600px;
    }

    .skill-item:hover {
      transform: scale(1.1) rotateX(10deg) rotateY(10deg);
      box-shadow:
        12px 12px 25px #6b8de3,
        -12px -12px 25px #d6f0ff;
      background: linear-gradient(145deg, #e2f0ff, #a0c4ff);
      color: #0d1b42;
    }
  </style>
</head>
<body>

<nav>
  <div class="logo">My Portfolio</div>
  <ul>
    <li><a href="home.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="resume.html">Resume</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="certifications.html">Certifications</a></li>
    <li><a href="skills.html">Skills</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<section id="skills">
  <h2>My Skills</h2>
  <div class="skills-box">
    <div class="skill-item">💻 HTML</div>
    <div class="skill-item">🎨 CSS</div>
    <div class="skill-item">🐍 Python</div>
    <div class="skill-item">☕ Java</div>
    <div class="skill-item">📊 SQL</div>
    <div class="skill-item">📡 IoT Basics</div>
  </div>
</section>

</body>
</html>
