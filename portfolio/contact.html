<head>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: linear-gradient(to right, #ece9e6, #ffffff);
      background-image: radial-gradient(circle at top left, rgba(255, 200, 200, 0.2), transparent),
                        radial-gradient(circle at bottom right, rgba(200, 200, 255, 0.2), transparent);
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #333;
      padding-top: 60px;
      line-height: 1.6;
    }
    nav {
      position: fixed;
      top: 0; left: 0; width: 100%;
      background-color: #2c3e50;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    nav .logo {
      font-size: 22px;
      font-weight: bold;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }
    nav ul li a:hover {
      color: #f39c12;
    }
    section {
      margin: 60px 20px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    h2 {
      font-size: 28px;
      border-left: 5px solid #3498db;
      padding-left: 10px;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    .contact-box {
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .contact-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    form label {
      font-weight: 500;
    }
    form input, form textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: border 0.3s;
      font-size: 16px;
    }
    form input:focus, form textarea:focus {
      border-color: #3498db;
      outline: none;
    }

    /* Animated Gradient Send Button */
    .send-button {
      background: linear-gradient(45deg, #12a726, #00c6ff);
      background-size: 200% auto;
      color: white;
      font-weight: bold;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-position 0.4s ease, transform 0.2s;
      font-size: 16px;
    }
    .send-button:hover {
      background-position: right center;
      transform: scale(1.05);
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 25px;
      flex-wrap: wrap;
    }
    .icon-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .icon-button {
      width: 50px;
      height: 50px;
      background-color: #f0f4f7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      position: relative;
    }

    .icon-button img {
      width: 26px;
      height: 26px;
    }

    .icon-button:hover {
      background-color: #3498db;
      box-shadow: 0 0 15px #3498db, 0 0 30px #3498db;
      transform: scale(1.2);
    }
    .icon-button:hover img {
      filter: brightness(0) invert(1);
    }

    /* Optional label below icon */
    .icon-label {
      font-size: 12px;
      color: #555;
    }

    iframe {
      width: 100%;
      height: 250px;
      margin-top: 30px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>
