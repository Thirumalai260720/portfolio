<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thirumalai Portfolio | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: linear-gradient(to right, #ece9e6, #ffffff);
      background-image: 
        radial-gradient(circle at top left, rgba(255, 200, 200, 0.2), transparent),
        radial-gradient(circle at bottom right, rgba(200, 200, 255, 0.2), transparent);
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #2c3e50;
      padding-top: 60px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    nav {
      position: fixed;
      top: 0; left: 0; width: 100%;
      background-color: #2c3e50;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 40px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      font-weight: 600;
      letter-spacing: 1px;
    }
    nav .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 28px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
      font-size: 16px;
      padding: 6px 0;
      position: relative;
    }
    nav ul li a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      background: #f39c12;
      left: 0; bottom: 0;
      transition: 0.3s;
    }
    nav ul li a:hover::after {
      width: 100%;
    }
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      max-width: 800px;
      margin: auto;
    }
    main h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.2;
      color: #1c2b4a;
      letter-spacing: 1.2px;
      animation: fadeInDown 1s ease forwards;
    }
    main h3 {
      font-size: 1.4rem;
      font-weight: 500;
      color: #34495e;
      margin-bottom: 40px;
      letter-spacing: 0.7px;
      animation: fadeInUp 1s ease 0.5s forwards;
      opacity: 0;
    }
    a.button {
      background: #f39c12;
      color: white;
      text-decoration: none;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 40px;
      box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
      transition: background 0.3s ease, transform 0.3s ease;
      display: inline-block;
      animation: fadeInUp 1s ease 1s forwards;
      opacity: 0;
    }
    a.button:hover {
      background: #d47e0a;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(212, 126, 10, 0.6);
    }
    @keyframes fadeInDown {
      0% { opacity: 0; transform: translateY(-30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      main h1 {
        font-size: 2.4rem;
      }
      main h3 {
        font-size: 1.1rem;
      }
      a.button {
        padding: 12px 28px;
        font-size: 1rem;
      }
      nav ul {
        gap: 15px;
      }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo">My Portfolio</div>
  <ul>
    <li><a href="about.html">About</a></li>
    <li><a href="resume.html">Resume</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="certifications.html">Certifications</a></li>
    <li><a href="skills.html">Skills</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<main>
  <h1>Hello, I'm Thirumalai Vasan S</h1>
  <h3>Pursuing Computer Science Engineering | Aspiring Software Developer</h3>
  <a href="contact.html" class="button">Hire Me</a>
</main>

</body>
</html>
